<!DOCTYPE html>
<html lang="pt-PT" ng-app="LoginApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAP System - Autenticação</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body class="bg-slate-50 flex items-center justify-center h-screen font-sans" ng-controller="LoginCtrl">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden transition-all duration-300">
        
        <div class="bg-[#111827] px-8 py-8 text-center">
            <h1 class="text-3xl font-bold text-white flex items-center justify-center gap-2 tracking-tight">
                <span class="bg-blue-600 p-2 rounded-xl text-xl shadow-md shadow-blue-900/50">⚙️</span> DAP System
            </h1>
            <p class="text-slate-400 text-xs mt-2 uppercase tracking-widest font-semibold">Módulo de Desmonte de Sucatas</p>
        </div>

        <div class="p-8">
            
            <div ng-show="mensagemErro" 
                 class="bg-red-50 text-red-600 p-3.5 rounded-xl text-sm font-medium mb-5 text-center border border-red-100 shadow-sm transition-all duration-300">
                {{ mensagemErro }}
            </div>

            <form name="loginForm" ng-submit="autenticar()" novalidate class="space-y-5">
                
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">E-mail Corporativo</label>
                    <input type="email" ng-model="credenciais.email" required name="email"
                           class="w-full border-slate-200 bg-slate-50 rounded-xl border p-3 text-sm font-medium outline-none transition focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 disabled:opacity-50"
                           placeholder="nome@dapsystem.com"
                           ng-disabled="processando">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Palavra-passe</label>
                        <a href="#" ng-click="esqueciSenha()" 
                           class="text-xs text-blue-600 hover:text-blue-800 font-semibold transition-colors duration-150">
                            Esqueceu a senha?
                        </a>
                    </div>
                    <input type="password" ng-model="credenciais.password" required name="password"
                           class="w-full border-slate-200 bg-slate-50 rounded-xl border p-3 text-sm font-medium outline-none transition focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 disabled:opacity-50"
                           placeholder="••••••••"
                           ng-disabled="processando">
                </div>

                <div class="pt-2 flex justify-center">
                    <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA" data-callback="captchaVerificado"></div>
                </div>

                <div class="grid grid-cols-3 gap-3 pt-4">
                    <button type="button" ng-click="limpar()" ng-disabled="processando"
                            class="col-span-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 px-4 rounded-xl text-sm transition-all duration-150 active:scale-95 disabled:opacity-50 disabled:pointer-events-none">
                        Limpar
                    </button>
                    
                    <button type="submit" ng-disabled="loginForm.$invalid || processando || !botVerificado" 
                            class="col-span-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl text-sm shadow-md shadow-blue-500/10 transition-all duration-150 active:scale-95 flex justify-center items-center gap-2 disabled:opacity-50 disabled:pointer-events-none">
                        <span ng-show="!processando">Entrar no Sistema</span>
                        <span ng-show="processando" class="flex items-center gap-1.5 animate-pulse">
                            Autenticando...
                        </span>
                    </button>
                </div>
            </form>
        </div>
        
        <div class="bg-slate-50 px-8 py-4 border-t border-slate-100 text-center">
            <p class="text-[11px] text-slate-400 font-medium">
                Conexão segura ponta a ponta. Uso exclusivo para operadores autorizados.
            </p>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>

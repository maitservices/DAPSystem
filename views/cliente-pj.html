<div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
    
    <div class="mb-6 border-b border-gray-100 pb-4">
        <h2 class="text-xl font-bold text-gray-800">Detalhes da Empresa (PJ)</h2>
        <p class="text-sm text-gray-500 mt-1">Preencha ou atualize os dados fiscais da empresa.</p>
    </div>

    <form name="clienteForm" novalidate>
        
        <fieldset ng-disabled="!isEditing || processando" class="grid grid-cols-1 md:grid-cols-2 gap-6 disabled:opacity-75 transition-opacity">
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Razão Social *</label>
                <input type="text" ng-model="cliente.razao_social" required 
                       class="w-full border-gray-300 rounded-md shadow-sm border p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none disabled:bg-gray-50 transition-colors">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nome Fantasia *</label>
                <input type="text" ng-model="cliente.nome_fantasia" required 
                       class="w-full border-gray-300 rounded-md shadow-sm border p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none disabled:bg-gray-50 transition-colors">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">CNPJ *</label>
                <input type="text" ng-model="cliente.cnpj" required cnpj-mask maxlength="18"
                       class="w-full border-gray-300 rounded-md shadow-sm border p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none disabled:bg-gray-50 transition-colors">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Inscrição Estadual *</label>
                <input type="text" ng-model="cliente.inscricao_estadual" required 
                       class="w-full border-gray-300 rounded-md shadow-sm border p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none disabled:bg-gray-50 transition-colors">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nome Sócio Majoritário</label>
                <input type="text" ng-model="cliente.socio_majoritario" 
                       class="w-full border-gray-300 rounded-md shadow-sm border p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none disabled:bg-gray-50 transition-colors">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">E-mail *</label>
                <input type="email" ng-model="cliente.email" required 
                       class="w-full border-gray-300 rounded-md shadow-sm border p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none disabled:bg-gray-50 transition-colors">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Whatsapp Responsável *</label>
                <input type="text" ng-model="cliente.whatsapp" required 
                       class="w-full border-gray-300 rounded-md shadow-sm border p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none disabled:bg-gray-50 transition-colors">
            </div>

            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">Descrição das atividades da empresa</label>
                <textarea ng-model="cliente.descricao_atividades" rows="3" 
                          class="w-full border-gray-300 rounded-md shadow-sm border p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none disabled:bg-gray-50 transition-colors"></textarea>
            </div>
        </fieldset>

        <div class="mt-8 pt-5 border-t border-gray-200 flex justify-end gap-3">
            
            <button type="button" ng-show="!isEditing" ng-click="habilitarEdicao()" 
                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-5 rounded-lg transition min-w-[120px] shadow-sm flex items-center justify-center gap-2">
                ✏️ Editar
            </button>
            
            <button type="button" ng-show="isEditing" ng-click="salvarDados()" ng-disabled="processando"
                    class="bg-green-600 hover:bg-green-700 text-white font-medium py-2.5 px-5 rounded-lg transition flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed min-w-[120px] shadow-sm">
                
                <span ng-if="!processando" class="flex items-center gap-2">
                    💾 Salvar
                </span>
                
                <span ng-if="processando" class="flex items-center gap-2">
                    <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Gravando...
                </span>
            </button>
            
        </div>
    </form>
</div>
